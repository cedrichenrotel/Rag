[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "ruff>=0.16.10",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = ["SIM103", "RUF100"]

[tool.mypy]
  exclude = ["^data/"]
  warn_return_any = true
  warn_unused_ignores = true
  ignore_missing_imports = true
  disallow_untyped_defs = true
  check_untyped_defs = true
